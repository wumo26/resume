plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '1.0.0'
description = '吳柏勳個人履歷網站'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def npmExecutable = providers.gradleProperty('npmExecutable')
        .orElse(System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm')

tasks.register('buildFrontend', Exec) {
    description = 'Build the shared Angular TypeScript frontend.'
    group = 'build'
    workingDir projectDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', npmExecutable.get(), 'run', 'build'
    } else {
        commandLine npmExecutable.get(), 'run', 'build'
    }
}

// Original files under static/ are Angular build inputs, not a second application.
sourceSets.main.resources.exclude 'static/**'

tasks.named('processResources') {
    dependsOn 'buildFrontend'
    inputs.dir layout.projectDirectory.dir('dist')
    doLast {
        project.sync {
            from project.layout.projectDirectory.dir('dist').asFile
            into project.layout.buildDirectory.dir('resources/main/static').get().asFile
        }
    }
}

tasks.register('exportSite', Sync) {
    description = 'Export the compiled Angular website for static hosting.'
    group = 'build'
    dependsOn 'buildFrontend'
    from 'dist'
    into 'build/static-site'
}
